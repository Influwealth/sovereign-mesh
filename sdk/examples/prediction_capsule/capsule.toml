[capsule]
id = "capsule.prediction.v1"
name = "Prediction Capsule"
version = "0.1.0"
description = "Example sovereign prediction capsule with mocked quantum inference boundary."
authors = ["Influwealth Quantum Labs"]
runtime = "sovereign-mesh-runtime"
wasm_target = "wasm32-unknown-unknown"
wasm_module = "prediction_capsule.wasm"

[entrypoints]
updates = ["predict"]
queries = ["health"]
update_dispatcher = "capsule_update_entry"
query_dispatcher = "capsule_query_entry"

[state]
schema = "prediction-state-v1"
mutable = true
retention = "sovereign-local"
stable = true
ephemeral = true
sealed = false

[governance]
capsule_class = "analytics"
review_required = false
jurisdiction = "sovereign"
upgrade_policy = "governance-approved"

[quantum]
enabled = true
provider = "mock"
model = "capsule-execution-readiness"
deterministic_required = true
params = "capsule-execution-readiness"
